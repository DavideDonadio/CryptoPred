[project]
name = "cryptopred"
version = "0.1.0"
description = "Crypto prediction pipeline with AutoML comparison"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "ccxt>=4.5.51",
    "fastapi[standard]>=0.136.3",
    "lightgbm>=4.3.0,<4.6.0",
    "numpy>=1.25.0,<2.4.0",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.4.0,<1.8.0",
    "undetected-chromedriver>=3.5.5",
    "vadersentiment>=3.3.2",
    "xgboost>=2.0.0,<2.2.0",
    "autogluon>=1.5.0",
    "ipywidgets>=8.1.8",
]
